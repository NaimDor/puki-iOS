# Builds a signed release and uploads it to App Store Connect (TestFlight). Run it by hand from the Actions tab
# (once this file is on main), or push a tag starting with ios-v.
#
# Needs three repository secrets, from an App Store Connect API key (Users and Access -> Integrations, role Admin,
# so Xcode can make the distribution certificate and profile itself):
#   ASC_ISSUER_ID  the issuer ID shown above the keys
#   ASC_KEY_ID     the key's ID
#   ASC_KEY_P8     the whole text of the downloaded AuthKey_XXXX.p8 file
name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]  # or push a tag like ios-v0.9.6

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: The safety word lists match Safety.kt
        run: python3 ios/scripts/sync_safety_swift.py --check

      - name: Use Xcode 26 (App Store Connect takes only builds from its SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen

      - name: The API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Add the ASC_ISSUER_ID, ASC_KEY_ID and ASC_KEY_P8 secrets first (see the top of this file)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          cd ios
          BUILD=$((96 + ${{ github.run_number }}))  # always above the last build number
          echo "build number: $BUILD"
          xcodebuild -project Puki.xcodeproj -scheme Puki -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Puki.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive > archive.log 2>&1
          status=$?
          grep -E "error:|warning: .*sign|\*\* ARCHIVE" archive.log | sort -u | head -100
          tail -20 archive.log
          exit $status

      - name: Mend the embedded frameworks
        # ONNX Runtime's framework ships without MinimumOSVersion, which App Store Connect requires.
        # The export below signs everything again, so the edit is safe.
        run: |
          for f in "$RUNNER_TEMP"/Puki.xcarchive/Products/Applications/Puki.app/Frameworks/*.framework; do
            p="$f/Info.plist"
            [ -f "$p" ] || continue
            if ! /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$p" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 17.0" "$p"
              echo "added MinimumOSVersion to $(basename "$f")"
            fi
          done

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>DA3SQCMQ26</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Puki.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
