# Builds the iOS app and runs its unit tests on every push that touches it.
name: iOS

on:
  push:
    paths: ["ios/**", "app/src/main/res/**", "app/src/main/java/io/github/tomsadeh/puki/brain/Safety.kt", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: The safety word lists match Safety.kt
        run: python3 ios/scripts/sync_safety_swift.py --check
      - name: Use Xcode 26 (App Store Connect takes only builds from its SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen
      - name: Build and test
        run: |
          set +e
          cd ios
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          ids = [x['udid'] for rt, xs in sorted(d.items(), reverse=True) if 'iOS' in rt for x in xs if x['isAvailable'] and 'iPad' in x['name']]
          ids += [x['udid'] for rt, xs in sorted(d.items(), reverse=True) if 'iOS' in rt for x in xs if x['isAvailable']]
          print(ids[0] if ids else '')")
          echo "simulator: $SIM"
          xcodebuild -project Puki.xcodeproj -scheme Puki -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO test > build.log 2>&1
          status=$?
          grep -E "error:|Test Suite|Test Case.*failed|Executed|\*\* (BUILD|TEST)" build.log | sort -u | head -300
          tail -30 build.log
          exit $status
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
